[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspirerank-api"
version = "0.15.0"
description = "FastAPI backend for InspireRank"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "pgvector>=0.3",
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.optional-dependencies]
data = [
  "datasets>=3.0",
  "huggingface-hub>=0.26",
]
ml = [
  "torch>=2.5",
  "transformers>=4.56",
  "pillow>=11.0",
  "httpx>=0.27",
  "safetensors>=0.4",
  "sentencepiece>=0.2.0,<1",
  "protobuf>=4.25,<7",
]
production = [
  "prometheus-client>=0.21,<1",
]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
